<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Masmorra do Mago - Protótipo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #blocker {
            position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background-color: white; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        .instrucoes { font-size: 18px; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 36px; text-shadow: 2px 2px 0 #ff00ff;">O Mago e a Masmorra</h1>
            <div class="instrucoes">
                Clique para jogar<br><br>
                <b>W, A, S, D</b> = Andar<br>
                <b>Mouse</b> = Olhar<br>
                <b>Botão Esquerdo</b> = Atirar Magia<br>
                <b>Botão Direito (ou Q)</b> = Inverter Gravidade<br>
            </div>
        </div>
    </div>

    <!-- Importando a biblioteca Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        const objects = [];
        const projectiles = [];
        const enemies = [];
        
        let raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        // Variáveis da Mecânica do Mago
        let gravityDirection = -1; // -1 = Chão, 1 = Teto
        const playerHeight = 2;
        const roomHeight = 20;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = playerHeight;

            // Iluminação da Masmorra
            const light = new THREE.HemisphereLight(0x444466, 0x111122, 0.8);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);
            
            const pointLight = new THREE.PointLight(0xffaa00, 1, 50);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');

            // Controles de Início
            document.addEventListener('click', function (event) {
                if (!controls.isLocked && event.button === 0) controls.lock();
            });
            controls.addEventListener('lock', function () { blocker.style.display = 'none'; });
            controls.addEventListener('unlock', function () { blocker.style.display = 'flex'; });
            scene.add(controls.getObject());

            // Teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'KeyQ': invertGravity(); break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Ações do Mouse (Tiro e Gravidade)
            document.addEventListener('mousedown', function(event) {
                if (!controls.isLocked) return;
                if (event.button === 0) shootMagic(); // Botão esquerdo
                if (event.button === 2) invertGravity(); // Botão direito
            });

            // Criar a Masmorra (Chão, Teto e Paredes)
            createDungeon();

            // Criar um Inimigo de Teste (Pedaço de Centopeia)
            spawnEnemy(0, 1, -10);
            spawnEnemy(5, 1, -15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            window.addEventListener('resize', onWindowResize);
        }

        function createDungeon() {
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshPhongMaterial({ color: 0x333333, depthWrite: false });
            
            // Chão
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Teto (Aonde o mago pode cair quando inverter a gravidade)
            const ceilMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            const ceiling = new THREE.Mesh(floorGeo, ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = roomHeight;
            scene.add(ceiling);

            // Paredes
            const wallMat = new THREE.MeshPhongMaterial({ color: 0x442222 });
            const wallGeo = new THREE.BoxGeometry(50, roomHeight, 1);
            
            const wall1 = new THREE.Mesh(wallGeo, wallMat);
            wall1.position.set(0, roomHeight/2, -25);
            scene.add(wall1);
            
            const wall2 = new THREE.Mesh(wallGeo, wallMat);
            wall2.position.set(0, roomHeight/2, 25);
            scene.add(wall2);
            
            const wall3 = new THREE.Mesh(wallGeo, wallMat);
            wall3.rotation.y = Math.PI / 2;
            wall3.position.set(-25, roomHeight/2, 0);
            scene.add(wall3);

            const wall4 = new THREE.Mesh(wallGeo, wallMat);
            wall4.rotation.y = Math.PI / 2;
            wall4.position.set(25, roomHeight/2, 0);
            scene.add(wall4);
        }

        function invertGravity() {
            gravityDirection *= -1; // Troca entre -1 (baixo) e 1 (cima)
        }

        function shootMagic() {
            const sphereGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const magic = new THREE.Mesh(sphereGeo, sphereMat);
            
            // Posição inicial da magia é a câmera
            magic.position.copy(controls.getObject().position);
            
            // Descobrir para onde a câmera está olhando
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            scene.add(magic);
            projectiles.push({ mesh: magic, direction: dir, life: 100 });
        }

        function spawnEnemy(x, y, z) {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshPhongMaterial({ color: 0x00ff00 }); // Inseto verde
            const bug = new THREE.Mesh(geo, mat);
            bug.position.set(x, y, z);
            scene.add(bug);
            enemies.push(bug);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                // Aplicando Gravidade Invertida!
                velocity.y += (30.0 * gravityDirection) * delta; 

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 40.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += velocity.y * delta;

                // Colisão com o Chão e o Teto
                if (controls.getObject().position.y < playerHeight) {
                    velocity.y = 0;
                    controls.getObject().position.y = playerHeight;
                }
                if (controls.getObject().position.y > roomHeight - playerHeight) {
                    velocity.y = 0;
                    controls.getObject().position.y = roomHeight - playerHeight;
                }

                // Atualizar Magias (Tiros)
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.mesh.position.addScaledVector(p.direction, 20 * delta); // Velocidade do tiro
                    p.life--;
                    
                    // Colisão simples do tiro com inimigos
                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (p.mesh.position.distanceTo(enemies[j].position) < 1.5) {
                            scene.remove(enemies[j]); // Mata o inseto
                            enemies.splice(j, 1);
                            hit = true;
                            break;
                        }
                    }

                    if (p.life <= 0 || hit) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
